name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Every human-authored commit must carry the Co-Authored-By: Claude trailer — this
  # repo's contributions are AI-assisted by policy, and the trailer is the record of it.
  ai-attribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history to walk base..head
      - name: check Co-Authored-By trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          # --no-merges: a merge commit carries no authorship of its own.
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            # Bots can't sign as AI-assisted, and release-please's own
            # "chore(release):" commits would otherwise deadlock every release.
            case "$author" in
              *"[bot]"*|*"noreply@github.com"*) continue ;;
            esac
            if git log -1 --format='%B' "$sha" | grep -qiE '^[[:space:]]*Co-Authored-By:[[:space:]]*Claude'; then
              echo "ok      $(git log -1 --format='%h %s' "$sha")"
            else
              echo "::error::$(git log -1 --format='%h %s' "$sha") is missing the 'Co-Authored-By: Claude' trailer"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo
            echo "Every commit must end with, e.g.:"
            echo "  Co-Authored-By: Claude Opus 4.8 (1M context) <noreply@anthropic.com>"
            echo "Fix with: git rebase -i --exec 'git commit --amend --no-edit --trailer \"Co-Authored-By: Claude <noreply@anthropic.com>\"' $BASE"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      # The release matrix ships windows binaries but no CI runner exercises that
      # GOOS — a compile-only check here keeps a broken windows build from
      # surfacing for the first time inside a release job.
      - name: cross-compile windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build ./...
      - name: golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  # The VS Code extension: lint, typecheck, unit tests, and a universal .vsix
  # built on every PR so an installable artifact is one click away.
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: install
        run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: package
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode/*.vsix
          if-no-files-found: error

  test:
    # internal/term's flushInput is per-GOOS — TIOCFLUSH (int*) on darwin, TCFLSH
    # (by value) on linux — and only one of them compiles on any given machine.
    # Running a single OS would leave the other ioctl completely unexercised, and
    # a wrong one fails silently: the ioctl reports no error and the stale
    # terminal replies stay queued as phantom keys.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: test
        # Live tests (ACY_LIVE) are opt-in — they need the `claude` CLI and auth,
        # so they are skipped in CI. The rest run with the race detector.
        run: go test -race ./...
